<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NACOC NSIMS - Offline</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-main: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
            text-align: center;
        }
        .offline-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05);
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
        }
        .icon-box svg {
            width: 40px;
            height: 40px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 0.75rem 0;
            color: var(--text-main);
        }
        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0 0 1.75rem 0;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary);
            color: #ffffff;
            padding: 0.85rem 1.75rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn-retry:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a5 5 0 010-7.072m-2.829 9.9a9 9 0 010-12.728M3 3l18 18" />
            </svg>
        </div>
        <h1>You're Offline</h1>
        <p>Unable to connect to the NACOC Store Management system. Please check your network connection and try again.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Try Again
        </button>
    </div>
</body>
</html>
